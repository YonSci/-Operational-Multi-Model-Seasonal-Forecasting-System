# DSSAT's cultivars for the crop engine's varieties (adapters/dssat_adapter.py, the third engine), apart from
# varieties.yaml so that the outlook's configuration (run_outlook.config_hash) does not change with them.
#
# `cultivar`: the DSSAT cultivar the variety starts from (DSSAT 4.8's own files: MZCER048.CUL, SGCER048.CUL,
# BNGRO048.CUL); the other keys override its coefficients. Calibrated by crop_engine/calibration/dssat.py
# (outputs/crop_engine/calibration/dssat/result.json, 12 Nov 2026), every coefficient within the file's MINIMA and
# MAXIMA:
#   phenology  maturity in the variety's maturity_days at 21 °C with no water stress, as AquaCrop's and WOFOST's:
#              maize P1 (the juvenile phase) scaled; sorghum P1 and P5, both at DSSAT's minimum, still mature in
#              109 days, not the class's 100 (DSSAT's sorghum cannot be shorter; PANTH, P3, P4 are fixed); dry bean
#              its five phases × 1.039
#   yield      medium maize with no water stress at Kiboko, 2012 dry-season sowings: Duma 43 well watered, 7.76
#              t/ha (Ngugi et al. 2013), through G2 and G3 × 1.477 (early maize the same factor; checks: 4.96 and
#              4.81 t/ha against the Local Katumani composite's 3.02 and the IITA 2013 median 4.5, upper bounds);
#              sorghum matched to AquaCrop's no-water-stress yield at Kiboko, SR 2012 sowings (4.97 t/ha), G2 ×
#              0.8595; the bean keeps DSSAT's yield level (no trial)
varieties:
  maize_early:  {cultivar: KY0018, P1: 96.15, G2: 664.7, G3: 15.51}      # Katumani Composite B-II
  maize_medium: {cultivar: KY0010, P1: 298.8, G2: 812.5, G3: 11.08}      # H512, mid-altitude hybrid
  sorghum:      {cultivar: IB0026, P1: 200.0, P5: 300.0, G2: 5.142}      # CSH-1, short-season tropical hybrid
  bean:         {cultivar: IB0014, EM-FL: 24.94, FL-SH: 3.636, FL-SD: 10.39, SD-PM: 20.26, FL-LF: 10.39}   # Canadian Wonder

# The soil with DSSAT's nitrogen balance on (crop_engine/run_nitrogen.py): the factor on the soil's organic nitrogen
# (SLNI = organic carbon / 10 × organic_n_factor), fitted by `python -m crop_engine.calibration.dssat --nitrogen`
# (outputs/crop_engine/calibration/dssat/nitrogen.json, 12 Nov 2026) so that early maize without fertiliser yields
# what Kenyan maize nitrogen trials give against 60 kg N/ha (about 0.6) over the observed Short Rains 1993-2016 at
# Kiboko and Kapiti. The SoilGrids carbon mineralises far more nitrogen than a cropped dryland field: at the fitted
# 0.06, the lower bound of the fit, the ratio is still 0.67 (1.0 at the factor 1, no response to fertiliser at all).
soil:
  organic_n_factor: 0.06
  # a site's own measured fields replace the regional factor: site id → {organic_n_factor: f, source: "..."} (from a
  # soil test's organic carbon and total nitrogen, or a nitrogen trial at the site; CROP_ENGINE.md "Questions for
  # partners"). None yet.
  sites: {}

# The nitrogen levels of crop_engine/run_nitrogen.py: assumed rates until the sites' managers report theirs.
# levels: kg N/ha of urea; split: (days after sowing, share) per AquaCrop crop key; sites: a site's reported practice,
# site id → {rate_kg_ha: n, label: "...", source: "..."}, added to that site's levels as "reported". None yet.
nitrogen:
  assumed: "Assumed rates, until the sites' managers report theirs; urea, 40 % at sowing and 60 % 30 days after (the bean all at sowing)"
  levels:
    n0:  {label: "No fertiliser", rate_kg_ha: 0}
    n25: {label: "25 kg N/ha (low)", rate_kg_ha: 25}
    n50: {label: "50 kg N/ha (moderate)", rate_kg_ha: 50}
  split:
    MaizeGDD:   [[0, 0.4], [30, 0.6]]
    SorghumGDD: [[0, 0.4], [30, 0.6]]
    DryBeanGDD: [[0, 1.0]]
  sites: {}
