# DSSAT's cultivars for the crop engine's varieties (adapters/dssat_adapter.py, the third engine), apart from
# varieties.yaml so that the outlook's configuration (run_outlook.config_hash) does not change with them.
#
# `cultivar`: the DSSAT cultivar the variety starts from (DSSAT 4.8's own files: MZCER048.CUL, SGCER048.CUL,
# BNGRO048.CUL); the other keys override its coefficients. Calibrated by crop_engine/calibration/dssat.py
# (outputs/crop_engine/calibration/dssat/result.json, 12 Nov 2026), every coefficient within the file's MINIMA and
# MAXIMA:
#   phenology  maturity in the variety's maturity_days at 21 °C with no water stress, as AquaCrop's and WOFOST's:
#              maize P1 (the juvenile phase) scaled; sorghum P1 and P5, both at DSSAT's minimum, still mature in
#              109 days, not the class's 100 (DSSAT's sorghum cannot be shorter; PANTH, P3, P4 are fixed); dry bean
#              its five phases × 1.039
#   yield      medium maize with no water stress at Kiboko, 2012 dry-season sowings: Duma 43 well watered, 7.76
#              t/ha (Ngugi et al. 2013), through G2 and G3 × 1.477 (early maize the same factor; checks: 4.96 and
#              4.81 t/ha against the Local Katumani composite's 3.02 and the IITA 2013 median 4.5, upper bounds);
#              sorghum matched to AquaCrop's no-water-stress yield at Kiboko, SR 2012 sowings (4.97 t/ha), G2 ×
#              0.8595; the bean keeps DSSAT's yield level (no trial)
varieties:
  maize_early:  {cultivar: KY0018, P1: 96.15, G2: 664.7, G3: 15.51}      # Katumani Composite B-II
  maize_medium: {cultivar: KY0010, P1: 298.8, G2: 812.5, G3: 11.08}      # H512, mid-altitude hybrid
  sorghum:      {cultivar: IB0026, P1: 200.0, P5: 300.0, G2: 5.142}      # CSH-1, short-season tropical hybrid
  bean:         {cultivar: IB0014, EM-FL: 24.94, FL-SH: 3.636, FL-SD: 10.39, SD-PM: 20.26, FL-LF: 10.39}   # Canadian Wonder

# The soil with DSSAT's nitrogen balance on (crop_engine/run_nitrogen.py): the factor on the soil's organic nitrogen
# (SLNI = organic carbon / 10 × organic_n_factor) and the mineral nitrogen at the start (1 Aug; ppm in the top 30 cm,
# half below). The starting mineral nitrogen is half the adapter's default (3 and 1 ppm): the KALRO Kiboko 2013
# irrigated nitrogen trial, the only one whose response is the field's nitrogen alone, is fitted only with half the
# default or less (`--nitrogen-sites`, outputs/crop_engine/calibration/dssat/nitrogen_sites.json, 12 Nov 2026); at
# the default it had set a floor that kept the regional fit at its lower bound (0.06, ratio 0.67). With it, the
# organic factor is fitted by `python -m crop_engine.calibration.dssat --nitrogen --initial-scale 0.5`
# (nitrogen.json, 12 Nov 2026) so that early maize without fertiliser yields what Kenyan maize nitrogen trials give
# against 60 kg N/ha (0.62) over the observed Short Rains 1993-2016 at Kiboko and Kapiti: 0.20 (ratio 0.628).
soil:
  organic_n_factor: 0.20
  initial_no3_ppm: 1.5
  initial_nh4_ppm: 0.5
  # a site's own fields replace the regional values: site id → {organic_n_factor, initial_no3_ppm, initial_nh4_ppm,
  # source} (a nitrogen trial on the site's fields, `--nitrogen-sites`; or a soil test's organic carbon and total
  # nitrogen, CROP_ENGINE.md "Questions for partners")
  sites:
    kalro_kiboko_makueni_farm:
      organic_n_factor: 0.1
      initial_no3_ppm: 1.5
      initial_nh4_ppm: 0.5
      source: "KALRO Kiboko 2013, irrigated, 0/40/80/160 kg N/ha with 20 kg P/ha (Kenya soil health compilation: doi 10.7910/DVN/SOAWL6 and its Dryad copy 10.5061/dryad.j3tx95xhc): the best organic factor at the regional starting mineral nitrogen (nitrogen_sites.json); the station's field may be more depleted than farmers' fields near it"

# The nitrogen levels of crop_engine/run_nitrogen.py: assumed rates until the sites' managers report theirs.
# levels: kg N/ha of urea; split: (days after sowing, share) per AquaCrop crop key; sites: a site's reported practice,
# site id → {rate_kg_ha: n, label: "...", source: "..."}, added to that site's levels as "reported". None yet.
nitrogen:
  assumed: "Assumed rates, until the sites' managers report theirs; urea, 40 % at sowing and 60 % 30 days after (the bean all at sowing)"
  levels:
    n0:  {label: "No fertiliser", rate_kg_ha: 0}
    n25: {label: "25 kg N/ha (low)", rate_kg_ha: 25}
    n50: {label: "50 kg N/ha (moderate)", rate_kg_ha: 50}
    # DSSAT's other inputs (dssat_adapter module doc), each at the low rate unless stated; assumed levels from the
    # literature (CROP_ENGINE.md "DSSAT, part 2")
    fym: {label: "Farmyard manure 2.5 t/ha, no urea", rate_kg_ha: 0, manure_t_ha: 2.5, manure_n_pct: 2.0, manure_p_pct: 0.36, manure_k_pct: 1.5}
    n25_low_p: {label: "25 kg N/ha on a low-phosphorus soil (Olsen P 4 mg/kg)", rate_kg_ha: 25, soil_p_mg_kg: 4}
    n25_p_mean: {label: "25 kg N/ha, soil phosphorus at the Machakos mean (Olsen P about 12 mg/kg)", rate_kg_ha: 25, soil_p_mg_kg: 12}
    n25_plough: {label: "25 kg N/ha, ox plough at sowing (15 cm)", rate_kg_ha: 25, tillage: true}
    # not used: low potassium and fall armyworm damage (soil_k_cmol_kg, pest) do not work in the installed DSSAT build
  split:
    MaizeGDD:   [[0, 0.4], [30, 0.6]]
    SorghumGDD: [[0, 0.4], [30, 0.6]]
    DryBeanGDD: [[0, 1.0]]
  # a site's farmers' practice, from surveys (until its managers report): field-average kg N/ha on maize
  sites:
    kalro_kiboko_makueni_farm: {rate_kg_ha: 13, label: "Farmers' practice: 13 kg N/ha (Eastern Lowlands field average)", source: "Sheahan, Black & Jayne 2012 (MSU IDWP 125), Tegemeo panel 2010: 51 % of maize fields fertilised at 25.5 kg N/ha; an upper bound for Kiboko, drier than the sampled villages (Wote, Makueni: under 6 % of households use fertiliser, CCAFS baseline 2012)"}
    kapiti_research_station_farm: {rate_kg_ha: 13, label: "Farmers' practice: 13 kg N/ha (Eastern Lowlands field average)", source: "Sheahan, Black & Jayne 2012 (MSU IDWP 125), Tegemeo panel 2010, Machakos and Makueni; an upper bound for the drier Kapiti plains"}
    el_karama_sahiwals_farm: {rate_kg_ha: 3, label: "Farmers' practice: about 3 kg N/ha (Laikipia field average)", source: "Tegemeo panel 2010, Marginal Rain Shadow: 6 % of maize fields at 22.2 kg N/ha; ASDSP 2014 (Laikipia climate risk profile 2018): 16 % use basal fertiliser"}
    livemo_ltd_memerush_kajiado: {rate_kg_ha: 0, label: "Farmers' practice: no fertiliser (Kajiado)", source: "Kajiado county climate risk profile 2018 (ASDSP 2014): under 2 % of households use fertiliser"}
    genco_ltd_maralal_samburu_farm: {rate_kg_ha: 0, label: "Farmers' practice: no fertiliser (Samburu)", source: "Samburu county climate risk profile 2021: 1 % use planting fertiliser, 5.7 % top-dress"}
    genco_ltd_tana_river_farm: {rate_kg_ha: 0, label: "Farmers' practice: no fertiliser, manure instead (Tana River)", source: "Tana River county climate risk profile 2016: farmers use manure rather than fertiliser (no rate given)"}
