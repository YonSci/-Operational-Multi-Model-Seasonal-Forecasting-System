# Pilot crop varieties for the Kenya Short Rains (AquaCrop-OSPy).
#
# Each variety is AquaCrop's own growing-degree-day parameter set for the crop, with every phenological stage
# (emergence, maximum rooting, flowering, yield formation, senescence, maturity) scaled so the crop reaches
# maturity in `maturity_days` at a daily mean temperature of `reference_tmean_c`; the canopy growth and decline
# coefficients are scaled inversely, so the canopy develops in step. Cooler sites therefore take longer and warmer
# sites less, as real varieties do.
#
# These are maturity classes, not cultivars: the examples name the kind of variety each class stands for in Kenyan
# drylands. Yields are water-limited (no nutrient, pest or disease stress), so they are an upper bound for
# smallholder fields.
#
# `parameters`: AquaCrop crop parameters set for Kenyan practice, used as given (after the phenology scaling).
# Maize and sorghum were set against the trials at the monitored sites (crop_engine/yields, targets.csv; Kiboko:
# maize trials median 4.5, high-input 6.1 dry t/ha; sorghum 2020 median 1.75, best 3.15, harvest index 0.28):
#   PlantPop  the recommended spacing, 75 x 30 cm for maize (44,444 /ha), 75 x 20 cm for sorghum (66,667 /ha);
#             AquaCrop's defaults (75,000 and 200,000) are high-input densities
#   CCx       maximum canopy cover of that density (AquaCrop's density sets only the initial canopy)
#   HI0       sorghum reference harvest index 0.30 (the Kiboko trial measured 0.28; AquaCrop's default 0.45);
#             maize 0.324 (calibration set kiboko_v3, below)
# The bean keeps AquaCrop's defaults: no bean trials near the sites.
#
# `wofost`: the second engine's (adapters/wofost_adapter.py) parameters. Maize AMAXTB_scale 0.511 (crop_engine/
# calibration/wofost.py): WOFOST's leaf photosynthesis table scaled so medium maize under full irrigation at Kiboko
# yields Duma 43's 7.76 t/ha, as kiboko_v3 fitted AquaCrop's HI0; early maize shares it. Sorghum keeps WOFOST's own;
# WOFOST has no dry bean.
#
# Maize is calibrated (crop_engine/calibration, CROP_ENGINE.md "Calibration sets"):
#   early  maturity_days 115   kiboko_v2: the local Katumani composite's days to silking at KARI Kiboko (2012, well
#                              watered; Ngugi et al. 2013), about 100 days to maturity at Kiboko; held-out IITA
#                              2013 early trials 8 days later (−19 before)
#   medium maturity_days 142   kiboko_v2: Duma 43's days to silking in the same trial, about 122 days at Kiboko;
#                              held-out IITA 2013 late trials 6.6 days later (−16.6 before). Adopted once the
#                              crop season ran to 31 Mar (it matures in March when sown in November)
#   both   HI0 0.324           kiboko_v3: Duma 43's yield under full irrigation in the same trial (7.76 t/ha)

# The days to maturity are those quoted for mid-altitude dryland Kenya (about 1,200-1,700 m: Katumani, Kiboko),
# where the Short Rains season averages about 21 °C (maize: calibrated, see above).
reference_tmean_c: 21.0

varieties:
  maize_early:
    label: Early-maturing maize
    examples: Katumani / DH-series type dryland maize
    aquacrop_crop: MaizeGDD
    maturity_days: 115          # kiboko_v2 (was 90)
    failure_t_ha: 0.5           # yield below this counts as a crop failure (grain, dry)
    parameters: {PlantPop: 44444, CCx: 0.75, HI0: 0.324}    # HI0: kiboko_v3 (AquaCrop's 0.48)
    wofost: {AMAXTB_scale: 0.511}   # WOFOST's yield level: Duma 43 under full irrigation (calibration/wofost.py)
  maize_medium:
    label: Medium-maturing maize
    examples: Duma 43 / mid-altitude hybrid type
    aquacrop_crop: MaizeGDD
    maturity_days: 142          # kiboko_v2 (was 120)
    failure_t_ha: 0.5
    parameters: {PlantPop: 44444, CCx: 0.75, HI0: 0.324}    # HI0: kiboko_v3 (AquaCrop's 0.48)
    wofost: {AMAXTB_scale: 0.511}   # WOFOST's yield level: Duma 43 under full irrigation (calibration/wofost.py)
  sorghum:
    label: Sorghum
    examples: Gadam type
    aquacrop_crop: SorghumGDD
    maturity_days: 100
    failure_t_ha: 0.5
    parameters: {PlantPop: 66667, CCx: 0.75, HI0: 0.30}
  bean:
    label: Dry bean
    examples: KAT-series type
    aquacrop_crop: DryBeanGDD
    maturity_days: 75
    failure_t_ha: 0.2
