services:
  - type: web
    name: seasonal-forecast-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OP_YEAR
        value: 2026
      - key: LOAD_BC_DAILY
        value: "0"
      # Forecast assistant (backend/assistant): set in the Render dashboard; without it the template explanations are used
      - key: ANTHROPIC_API_KEY
        sync: false
