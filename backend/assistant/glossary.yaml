# Terms for the assistant's Kiswahili and Amharic text: MACHINE-ASSISTED DRAFT, NOT YET REVIEWED.
#
# The translator (assistant/translate.py) must use these terms. A native-speaking reviewer (ideally an
# agrometeorologist or extension officer) should correct them, set `status: reviewed` and fill `reviewed_by`;
# until every term of a language is reviewed, all text in that language carries "Machine translation, not yet
# reviewed". Keep acronyms (RPSS, CHIRPS, ECMWF) and numbers unchanged in every language.

languages:
  sw: {name: Kiswahili, native: Kiswahili, speech: sw-KE, status: draft, reviewed_by: null}
  am: {name: Amharic, native: አማርኛ, speech: am-ET, status: draft, reviewed_by: null}

terms:
  onset of the rains:        {sw: kuanza kwa mvua, am: የዝናብ መጀመሪያ}
  end of the rains:          {sw: kwisha kwa mvua, am: የዝናብ ማብቂያ}
  cessation:                 {sw: kwisha kwa mvua, am: የዝናብ ማብቂያ}
  season length:             {sw: urefu wa msimu wa mvua, am: የዝናብ ወቅት ርዝመት}
